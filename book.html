<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasper | Book Transport & Equipment</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tabs { display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 30px; }
    .tab { padding: 15px 30px; cursor: pointer; color: var(--text-muted); font-family: var(--font-heading); font-weight: bold; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: var(--accent-teal); border-bottom-color: var(--accent-teal); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .contact-section {
      border-top: 1px solid var(--border-color); margin-top: 24px; padding-top: 24px;
    }
    .contact-section h4 {
      font-family: var(--font-heading); font-size: 0.8rem; letter-spacing: 1px;
      color: var(--text-muted); text-transform: uppercase; margin-bottom: 16px;
    }
    .required-star { color: var(--alert-amber); }
  </style>
</head>
<body>
  <nav class="navbar" style="position:static; padding:20px 40px; justify-content:center;">
    <div class="logo">
      <a href="index.html" style="color:inherit;text-decoration:none;"><span class="icon">⬢</span> KASPER</a>
    </div>
  </nav>

  <div class="approve-container">
    <h2 style="font-size:2.5rem;margin-bottom:10px;">Book Capacity</h2>
    <p style="color:var(--text-muted);margin-bottom:30px;font-size:1.1rem;">
      Select the type of capacity you need. Our team will contact you within 30 minutes.
    </p>

    <div class="tabs">
      <div class="tab active" data-tab="equipment">Equipment Rental</div>
      <div class="tab" data-tab="logistics">Logistics & Freight</div>
    </div>

    <!-- ── Equipment Tab ─────────────────────────────────────── -->
    <div id="equipment-tab" class="tab-content active">
      <form class="glass-form" style="background:var(--bg-main);" id="equipment-booking-form">

        <div class="form-row">
          <div class="input-group">
            <label>Equipment Type</label>
            <select id="eq-type-select" name="equipment_type" required>
              <option value="Boom Truck">Boom Truck</option>
              <option value="Flatbed Trailer (40ft)">Flatbed Trailer (40ft)</option>
              <option value="Low-Bed Trailer">Low-Bed Trailer</option>
              <option value="Mobile Generator">Mobile Generator</option>
            </select>
          </div>
          <div class="input-group">
            <label>Duration / Period</label>
            <select name="duration" required>
              <option>1 Day</option>
              <option>3 Days</option>
              <option>1 Week</option>
              <option>1 Month</option>
              <option>Long Term Contract</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label>Start Date</label>
            <input type="date" name="start_date" required>
          </div>
          <div class="input-group">
            <label>Delivery Emirate</label>
            <select name="emirate" required>
              <option>Dubai</option>
              <option>Abu Dhabi</option>
              <option>Sharjah</option>
              <option>Fujairah</option>
              <option>Ras Al Khaimah</option>
              <option>Ajman</option>
              <option>Umm Al Quwain</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label>Site Zone / Address Details</label>
            <input type="text" name="site_address" placeholder="e.g. Al Quoz Ind 2, Plot 15">
          </div>
        </div>

        <!-- Contact section -->
        <div class="contact-section">
          <h4>Your Contact Details</h4>
          <div class="form-row">
            <div class="input-group">
              <label>Full Name <span class="required-star">*</span></label>
              <input type="text" name="client_name" placeholder="Mohammed Al Rashidi" required>
            </div>
            <div class="input-group">
              <label>Phone <span class="required-star">*</span></label>
              <input type="tel" name="client_phone" placeholder="05X XXX XXXX" required>
            </div>
          </div>
          <div class="form-row">
            <div class="input-group">
              <label>Email <small style="color:var(--text-muted)">(for quote delivery)</small></label>
              <input type="email" name="client_email" placeholder="you@company.com">
            </div>
            <div class="input-group">
              <label>Company Name</label>
              <input type="text" name="company_name" placeholder="Optional">
            </div>
          </div>
        </div>

        <button type="button" class="btn btn-primary w-100 mt-20 submit-book-btn"
          style="padding:15px;font-size:1.1rem;" data-type="equipment">
          Request Equipment Quote
        </button>
      </form>
    </div>

    <!-- ── Logistics Tab ─────────────────────────────────────── -->
    <div id="logistics-tab" class="tab-content">
      <form class="glass-form" style="background:var(--bg-main);" id="logistics-booking-form">

        <div class="form-row">
          <div class="input-group">
            <label>Origin</label>
            <select name="origin" required>
              <option>Khor Fakkan</option>
              <option>Fujairah</option>
              <option>Jebel Ali</option>
              <option>Abu Dhabi</option>
              <option>Sharjah</option>
            </select>
          </div>
          <div class="input-group">
            <label>Destination</label>
            <select name="destination" required>
              <option>Dubai</option>
              <option>Abu Dhabi</option>
              <option>Sharjah</option>
              <option>Ras Al Khaimah</option>
              <option>Fujairah</option>
              <option>Muscat, Oman</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="input-group">
            <label>Cargo Type</label>
            <select name="cargo_type" required>
              <option value="container">Standard Container</option>
              <option value="materials">Construction Materials</option>
              <option value="oversized">Oversized Machinery</option>
            </select>
          </div>
          <div class="input-group">
            <label>Pickup Date</label>
            <input type="date" name="pickup_date" required>
          </div>
        </div>

        <!-- Contact section -->
        <div class="contact-section">
          <h4>Your Contact Details</h4>
          <div class="form-row">
            <div class="input-group">
              <label>Full Name <span class="required-star">*</span></label>
              <input type="text" name="client_name" placeholder="Mohammed Al Rashidi" required>
            </div>
            <div class="input-group">
              <label>Phone <span class="required-star">*</span></label>
              <input type="tel" name="client_phone" placeholder="05X XXX XXXX" required>
            </div>
          </div>
          <div class="form-row">
            <div class="input-group">
              <label>Email <small style="color:var(--text-muted)">(for quote delivery)</small></label>
              <input type="email" name="client_email" placeholder="you@company.com">
            </div>
            <div class="input-group">
              <label>Company Name</label>
              <input type="text" name="company_name" placeholder="Optional">
            </div>
          </div>
        </div>

        <button type="button" class="btn btn-primary w-100 mt-20 submit-book-btn"
          style="padding:15px;font-size:1.1rem;" data-type="logistics">
          Request Freight Quote
        </button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/kasper-db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
