<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasper | Order Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar" style="position:static;">
        <div class="logo">
            <a href="index.html" style="color:inherit; text-decoration:none;"><span class="icon">⬢</span> KASPER</a>
        </div>
        <div class="nav-links">
            <a href="index.html#equipment">Equipment Rental</a>
            <a href="index.html#freight">Freight Booking</a>
        </div>
    </nav>

    <div class="track-container">
        
        <!-- Search UI (Shown if NO job_id parameter) -->
        <div id="search-hero-UI" class="search-hero">
            <h1 style="font-size: 3rem; margin-bottom: 20px;">Track Order</h1>
            <p style="color: var(--text-muted); margin-bottom: 40px; font-size: 1.25rem;">Enter your Job Code to view live status and documents.</p>
            <form id="search-job-form">
                <input type="text" id="job-search-input" placeholder="e.g. KSP-1234" required />
                <button type="submit" class="btn btn-primary" style="padding: 20px 40px; font-size: 1.25rem;">Track</button>
            </form>
            <p style="margin-top: 30px; font-size: 0.9rem; color: var(--text-muted);">Try mock codes: KSP-9999 (Delivered) or KSP-4444 (In Transit)</p>
        </div>

    </div>
    
    <div id="toast-container"></div>
    <script src="js/kasper-db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
