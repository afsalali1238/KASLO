<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasper | Alternatives</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
    <nav class="navbar" style="position:static;">
        <div class="logo">
            <a href="index.html" style="color:inherit; text-decoration:none;"><span class="icon">⬢</span> KASPER</a>
        </div>
    </nav>

    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: 40px;">
        <div style="background: rgba(186, 117, 23, 0.1); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 30px;">
            <span style="font-size: 2rem; color: var(--alert-amber);">⚠</span>
        </div>
        <h1 style="font-size: 3rem; margin-bottom: 20px;">Job Request Declined</h1>
        <p style="color: var(--text-muted); font-size: 1.25rem; max-width: 600px; margin-bottom: 40px;">
            We have registered your decline. If this was an equipment fulfillment issue, our operations team will contact you shortly to discuss alternatives.
        </p>
        
        <div style="display: flex; gap: 20px;">
            <button class="btn btn-primary" onclick="window.location.href='index.html'">Return Home</button>
            <button class="btn btn-secondary" onclick="window.location.href='track.html'">Track Active Jobs</button>
        </div>
    </div>
</body>
</html>
